<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Box Stock</title>
<meta name="theme-color" content="#E1D2BF">
<meta name="apple-mobile-web-app-title" content="Box Stock">
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="icon" href="assets/icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/fonts.css">
<style>
/* Layout: one narrow column on the Yarvo paper page, cards and hairlines as on the
   company site, steppers sized for gloves. Tokens copied from the site's generated
   TOKENS block (Website/brand/yarvo.dna.json). The site has no dark theme, so
   neither does this page. */
:root {
  --teal: #008A8A; --teal-dark: #0A6E6E;
  --sand: #ECE0D0; --cream: #E1D2BF; --page: #FBF9F5;
  --ink: #463C32; --heading: #FFFFFF; --ink-soft: #6B655C;
  --line: #DAD2C4; --line-hard: #C3B8A5;
  --low: #9C3D2B; --low-bg: #F3DED5;
  --font-display: 'GFS Didot', Georgia, serif;
  --font-ui: 'Poppins', Arial, sans-serif;
  --ease: cubic-bezier(.4, 0, .2, 1);
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--cream); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; color: var(--ink); font: 17px/1.45 var(--font-display);
  -webkit-font-smoothing: antialiased; position: relative; isolation: isolate;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(96px + env(safe-area-inset-bottom, 0px));
}
body::before {
  content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: var(--cream) url("assets/bg-pattern-v3.webp") center/1254px 1254px repeat;
}
[hidden] { display: none !important; }
.wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 22px; }
.top { display: flex; align-items: center; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--line-hard); }
.logo { font: 700 26px/1 'Inter Tight', var(--font-ui); color: var(--teal); letter-spacing: -.04em; text-decoration: none; }
.top .tag { font: 600 11px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-soft); }
.eyebrow { font: 600 12px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--teal); }
h1 { font: 400 clamp(40px, 11vw, 54px)/1.02 var(--font-display); color: var(--heading); letter-spacing: .005em; margin: 10px 0 0; text-wrap: balance; overflow-wrap: anywhere; }
h2 { font: 600 12px/1 var(--font-ui); letter-spacing: .16em; text-transform: uppercase; margin: 0; color: var(--ink-soft); }
.meta { font: 400 13px/1.4 var(--font-ui); color: var(--ink-soft); margin-top: 8px; }
a { color: var(--teal); }
.back { font: 600 12px/1 var(--font-ui); letter-spacing: .1em; text-transform: uppercase; text-decoration: none; display: inline-block; padding: 8px 0; }
.headrow { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.headrow > div { min-width: 0; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--teal); outline-offset: 3px; }

/* Buttons as on the site: square, Poppins caps, solid teal or a teal outline. */
.btn { font: 600 13px/1 var(--font-ui); letter-spacing: .1em; text-transform: uppercase; padding: 14px 22px; border: 1.5px solid var(--teal); border-radius: 0; background: transparent; color: var(--teal); transition: background .15s var(--ease), color .15s var(--ease); }
.btn:hover { background: var(--teal); color: #fff; }
.btn.primary { background: var(--teal); color: #fff; }
.btn.primary:hover { background: var(--teal-dark); border-color: var(--teal-dark); }
.btn.danger { color: var(--low); border-color: var(--low); }
.btn.danger:hover, .btn.armed { background: var(--low); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }

.list { list-style: none; margin: 0; padding: 0; background: var(--page); border: 1px solid var(--line); border-radius: 4px; }
.list > li + li { border-top: 1px solid var(--line); }
.boxlink { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px; color: inherit; text-decoration: none; min-height: 68px; transition: background .15s var(--ease); }
.boxlink:hover { background: var(--sand); }
.boxlink .name { font: 400 24px/1.1 var(--font-display); overflow-wrap: anywhere; }
.boxlink > div { min-width: 0; }
.chev { color: var(--teal); font: 400 26px/1 var(--font-ui); }

.item { display: flex; align-items: center; gap: 12px; padding: 14px 12px 14px 18px; min-height: 84px; }
.item-main { flex: 1; min-width: 0; }
.item-name { font: 400 20px/1.2 var(--font-display); overflow-wrap: break-word; }
.item-sub { font: 400 12px/1.3 var(--font-ui); color: var(--ink-soft); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
.chip { font: 600 10px/1 var(--font-ui); letter-spacing: .14em; text-transform: uppercase; padding: 5px 8px; background: var(--low-bg); color: var(--low); }
.item.low { box-shadow: inset 3px 0 0 var(--low); }
.stepper { display: flex; align-items: center; gap: 6px; flex: none; }
.step { width: 54px; height: 54px; border: 1.5px solid var(--teal); border-radius: 0; background: transparent; color: var(--teal); font: 500 28px/1 var(--font-ui); display: grid; place-items: center; user-select: none; -webkit-user-select: none; }
.step:active { background: var(--teal); color: #fff; }
.step:disabled { border-color: var(--line-hard); color: var(--line-hard); cursor: default; }
.qty { font: 400 38px/1 var(--font-display); min-width: 2.2ch; text-align: center; font-variant-numeric: lining-nums tabular-nums; }
.item.low .qty { color: var(--low); }
.qty.dirty { opacity: .55; }

.edit-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 16px 18px; align-items: center; }
.edit-row .field { grid-column: 1 / -1; }
.edit-row label { display: flex; align-items: center; gap: 8px; font: 400 12px/1.3 var(--font-ui); color: var(--ink-soft); }
input[type="text"], input[type="number"] { width: 100%; min-width: 0; padding: 11px 12px; border: 1px solid var(--line-hard); border-radius: 3px; background: var(--page); font: 400 16px/1.2 var(--font-ui); color: var(--ink); outline: none; transition: border-color .15s var(--ease); }
input:focus { border-color: var(--teal); box-shadow: 0 0 0 1px var(--teal); }
.edit-row input[type="number"] { width: 5.5em; }

.panel { background: var(--page); border: 1px solid var(--line); border-radius: 4px; padding: 18px; display: grid; gap: 14px; }
.panel p { margin: 0; font: 400 13px/1.45 var(--font-ui); color: var(--ink-soft); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form .full { grid-column: 1 / -1; }
.form label { display: grid; gap: 6px; font: 600 11px/1 var(--font-ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.taglink { font: 400 13px/1.45 ui-monospace, "Cascadia Mono", Consolas, monospace; background: var(--sand); border: 1px solid var(--line); border-radius: 3px; padding: 10px 12px; overflow-wrap: anywhere; user-select: all; -webkit-user-select: all; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.lowlist { list-style: none; margin: 0; padding: 0; }
.lowlist li + li { border-top: 1px solid var(--line); }
.lowlist a { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; text-decoration: none; color: inherit; padding: 12px 0; }
.lowlist .what { min-width: 0; overflow-wrap: anywhere; font: 400 18px/1.25 var(--font-display); }
.lowlist .what small { display: block; font: 400 12px/1.3 var(--font-ui); color: var(--ink-soft); margin-top: 2px; }
.lowlist .n { font: 400 24px/1 var(--font-display); color: var(--low); white-space: nowrap; }

.empty { text-align: center; padding: 30px 18px; font: 400 14px/1.5 var(--font-ui); color: var(--ink-soft); }
.empty strong { display: block; color: var(--ink); font: 400 28px/1.1 var(--font-display); margin-bottom: 8px; }
.banner { padding: 12px 16px; background: var(--sand); border: 1px solid var(--line); border-radius: 4px; font: 400 13px/1.45 var(--font-ui); }
.foot { text-align: center; font: 400 12px/1.4 var(--font-ui); color: var(--ink-soft); }

.thumbbtn { flex: none; width: 48px; height: 48px; padding: 0; border: 1px solid var(--line); border-radius: 3px; background: var(--sand); overflow: hidden; }
.thumbbtn img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbbtn img:not([src]) { visibility: hidden; }
/* On a phone a photo row cannot fit thumb, name and the glove-sized stepper
   on one line, so the stepper takes a second line. */
@media (max-width: 440px) {
  .item.has-photo { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 10px 12px; }
  .item.has-photo .stepper { grid-column: 1 / -1; justify-self: end; }
}
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip-path: inset(50%); }
label.btn { display: inline-block; cursor: pointer; }
.edit-row .photo-row { grid-column: 1 / -1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.btn.small { padding: 10px 14px; font-size: 11px; }
.btn.block { width: 100%; padding: 18px; font-size: 14px; }
.kitline { display: flex; align-items: center; gap: 12px; padding: 12px 18px; min-height: 72px; }
.kitline .need { font: 400 26px/1 var(--font-display); white-space: nowrap; font-variant-numeric: lining-nums tabular-nums; }
.kitline.short { box-shadow: inset 3px 0 0 var(--low); }
.kit-edit { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 12px 18px; }
.kit-edit input[type="number"], .count-row input[type="number"] { width: 5em; text-align: center; }
.count-row { display: flex; align-items: center; gap: 12px; padding: 12px 18px; min-height: 72px; }
.count-row input[type="number"] { font: 400 22px/1 var(--font-display); padding: 10px 6px; }
select { width: 100%; min-width: 0; padding: 11px 12px; border: 1px solid var(--line-hard); border-radius: 3px; background: var(--page); font: 400 16px/1.2 var(--font-ui); color: var(--ink); }
.took { display: grid; gap: 12px; }
#lightbox { position: fixed; inset: 0; z-index: 30; background: rgba(70, 60, 50, .94); display: grid; place-items: center; gap: 12px; align-content: center; padding: calc(16px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); cursor: zoom-out; }
#lightbox img { max-width: 100%; max-height: 80vh; background: var(--sand); }
#lightbox p { margin: 0; color: var(--page); font: 400 14px/1.4 var(--font-ui); text-align: center; }
#status { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; justify-content: center; pointer-events: none; }
#status div { max-width: 560px; width: 100%; background: var(--ink); color: var(--page); padding: 14px 18px; font: 400 14px/1.4 var(--font-ui); pointer-events: auto; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script src="config.js"></script>
<script src="store.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top"><a class="logo" href="#">Yarvo</a><span class="tag">Install stock</span></header>
  <div class="banner" id="sync" hidden></div>
  <div class="wrap" id="app">
    <div>
      <div class="eyebrow">Stock</div>
      <h1>Boxes</h1>
      <div class="meta">Loading…</div>
    </div>
  </div>
</div>
<div id="status" aria-live="polite"></div>
<div id="lightbox" hidden><img alt=""><p></p></div>

<script>
const REPO = window.STOCK_REPO || '';
const FILE = window.STOCK_FILE || 'stock.json';
const API_BASE = window.STOCK_API_BASE || 'https://api.github.com';
const QKEY = 'box-stock-queue';
const KKEY = 'box-stock-key';

const app = document.getElementById('app');
const syncEl = document.getElementById('sync');
const statusEl = document.getElementById('status');
const S = {
  boxes: new Map(), items: new Map(), kits: new Map(), loaded: false, lastWrite: 0,
  kitView: null, counting: false, lastTake: null,
  offline: false, badKey: false, editing: false, armed: null, view: null,
};
let KEY = null;
try { KEY = localStorage.getItem(KKEY); } catch {}

// Taps not yet saved to the repo. Kept in localStorage so a locked phone or
// closed tab does not lose them; each keeps its request id, and the stock file
// remembers recent ids, so a resend after lost signal counts once.
let queue = [];
try { queue = JSON.parse(localStorage.getItem(QKEY) || '[]'); } catch {}
function saveQueue() { try { localStorage.setItem(QKEY, JSON.stringify(queue)); } catch {} }
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 10);

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'text') el.textContent = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}

const canEdit = () => !!REPO && !!KEY && !S.badKey;
const num = v => (Number.isFinite(Number(v)) ? Number(v) : 0);
const hasMin = it => it.min !== null && it.min !== undefined && it.min !== '';
const queued = id => queue.reduce((s, o) => s + (o.id === id ? o.delta : 0), 0);
const shownQty = id => Math.max(0, num(S.items.get(id)?.qty) + queued(id));
const isLow = (id, it) => hasMin(it) && shownQty(id) <= num(it.min);
const byName = (a, b) => String(a[1].name || '').localeCompare(String(b[1].name || ''), undefined, { numeric: true, sensitivity: 'base' });
const plural = (n, one, many) => n + ' ' + (n === 1 ? one : many);
const tagUrl = id => location.origin + location.pathname + '#box=' + encodeURIComponent(id) + '&k=' + encodeURIComponent(KEY);

function itemsIn(boxId) { return [...S.items].filter(([, it]) => it.box === boxId).sort(byName); }
function sortedBoxes() { return [...S.boxes].sort((a, b) => num(a[1].order) - num(b[1].order) || byName(a, b)); }

function ago(iso) {
  const t = Date.parse(iso);
  if (!t) return '';
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  const d = Math.round(s / 86400);
  return d === 1 ? 'yesterday' : d + ' days ago';
}

let statusTimer;
function say(msg, ms = 6000) {
  statusEl.replaceChildren(msg ? h('div', { text: msg }) : '');
  clearTimeout(statusTimer);
  if (msg && ms) statusTimer = setTimeout(() => say(''), ms);
}

// ---------- talking to GitHub ----------

// The stock list is one JSON file in a private repo. The tag code is a GitHub
// token that can only read and write that repo's contents.
const b64encode = str => { let bin = ''; for (const b of new TextEncoder().encode(str)) bin += String.fromCharCode(b); return btoa(bin); };
const b64decode = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64.replace(/\s/g, '')), c => c.charCodeAt(0)));

function err(message, kind) { const e = new Error(message); if (kind) e[kind] = true; return e; }

// path is relative to the repo root; raw returns the file's bytes as a Blob.
async function gh(method, body, path = FILE, raw = false) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 20000);
  try {
    let r;
    try {
      r = await fetch(API_BASE + '/repos/' + REPO + '/contents/' + path, {
        method, cache: 'no-store', signal: ctl.signal,
        headers: { Authorization: 'Bearer ' + KEY, Accept: raw ? 'application/vnd.github.raw' : 'application/vnd.github+json', ...(body ? { 'Content-Type': 'application/json' } : {}) },
        body: body ? JSON.stringify(body) : undefined,
      });
    } catch { throw err('no connection', 'offline'); }
    if (r.status === 401) throw err('GitHub rejected the tag code', 'badKey');
    if (r.status === 409 || (r.status === 422 && method === 'PUT')) throw err('another phone saved first', 'conflict');
    if (r.status === 404) throw err('this tag code cannot see ' + REPO + '/' + path + '. The token needs Contents access to that repo.', 'notFound');
    if (r.status === 403) throw err('GitHub refused the change (403). The token may be read-only or over its hourly limit.');
    if (!r.ok) throw err('GitHub answered ' + r.status + ' for ' + REPO + '/' + path + '. Try again in a minute.');
    return raw ? r.blob() : r.json();
  } finally { clearTimeout(t); }
}

const io = {
  async read() {
    const j = await gh('GET');
    let state;
    try { state = JSON.parse(b64decode(j.content)); }
    catch { throw err(FILE + ' in ' + REPO + ' is not valid JSON. Fix or revert it in the repo.'); }
    return { state: BoxStore.normalise(state), sha: j.sha };
  },
  async write(state, sha, message) {
    const j = await gh('PUT', { message, sha, content: b64encode(JSON.stringify(state, null, 2) + '\n') });
    return j.content.sha;
  },
};

function applyState(state) {
  S.boxes = new Map(state.boxes.map(b => [b.id, b]));
  S.items = new Map(state.items.map(i => [i.id, i]));
  S.kits = new Map(state.kits.map(k => [k.id, k]));
  S.loaded = true;
  S.offline = false;
}

function fail(e, what) {
  if (e.badKey) { S.badKey = true; render(); return; }
  if (e.offline) { S.offline = true; paintSync(); return; }
  say(what + ': ' + e.message, 9000);
}

const now = () => new Date().toISOString();

// Sends every queued tap as one commit.
let sendTimer, retryTimer, draining = false;
async function drain() {
  clearTimeout(sendTimer);
  if (draining || !queue.length || !canEdit()) return;
  draining = true;
  const batch = queue.slice();
  for (const o of batch) o.sent = true;
  saveQueue();
  let ok = false;
  try {
    const res = await BoxStore.commit(io, batch.map(o => ({ op: 'bump', id: o.id, delta: o.delta, rid: o.rid, at: o.at })));
    queue = queue.filter(o => !batch.includes(o));
    saveQueue();
    S.lastWrite = Date.now();
    applyState(res.state);
    if (res.errors.length) say('Not saved: ' + res.errors[0].message, 9000);
    ok = true;
  } catch (e) {
    fail(e, 'Counts not saved');
    if (!S.badKey) { clearTimeout(retryTimer); retryTimer = setTimeout(drain, e.offline ? 8000 : 15000); }
  } finally {
    draining = false;
    if (ok && queue.length) sendTimer = setTimeout(drain, 300);
    refresh();
  }
}

function bump(id, d) {
  if (!canEdit() || !S.items.has(id)) return;
  const shown = shownQty(id);
  if (shown + d < 0) return;
  const last = queue[queue.length - 1];
  if (last && !last.sent && last.id === id) {
    last.delta += d;
    last.at = now();
    if (!last.delta) queue.pop();
  } else {
    queue.push({ rid: rid(), op: 'bump', id, delta: d, at: now() });
  }
  saveQueue();
  paintQty(id);
  paintSync();
  clearTimeout(sendTimer);
  sendTimer = setTimeout(drain, 700);
}

// GitHub can serve the old file for a few seconds after a save, so polling
// waits 8 s after this phone's own write rather than flick a count back.
async function poll() {
  if (!REPO || !KEY || S.badKey || draining || acting || queue.length || document.visibilityState === 'hidden' || Date.now() - S.lastWrite < 8000) return;
  try {
    const { state } = await io.read();
    if (!draining && !acting && !queue.length) applyState(state);
  } catch (e) {
    fail(e, 'Could not load stock');
  }
  refresh();
}

// One-off actions (adding, renaming, deleting) need signal and report back.
let acting = false;
async function act(op, what) {
  if (acting) { say('Still saving the last change. Try again in a moment.'); return null; }
  acting = true;
  try {
    const full = { ...op, rid: rid(), at: now() };
    const res = await BoxStore.commit(io, [full]);
    S.lastWrite = Date.now();
    applyState(res.state);
    if (res.errors.length) { say(what + ': ' + res.errors[0].message, 9000); return null; }
    return { ...res, op: full };
  } catch (e) {
    if (e.offline) say(what + ': no connection. Try again once you have signal.', 9000);
    else fail(e, what);
    return null;
  } finally {
    acting = false;
    render();
  }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') drain(); else { drain(); poll(); }
});
addEventListener('online', () => { drain(); poll(); });
setInterval(poll, 20000);

// ---------- actions ----------

async function addBox(input) {
  const name = input.value.trim();
  if (!name) return;
  const before = new Set(S.boxes.keys());
  if (await act({ op: 'addBox', name }, 'Box not added')) {
    const id = [...S.boxes.keys()].find(k => !before.has(k));
    if (id) location.hash = 'box=' + encodeURIComponent(id);
    say('Added ' + name + '. Write its tag link from the bottom of its page.');
  }
}

async function addItem(boxId, form) {
  const el = form.elements;
  const name = el.itemName.value.trim();
  if (!name) return;
  const ok = await act({ op: 'addItem', box: boxId, name, unit: el.itemUnit.value.trim(), newId: 'i' + rid(),
    qty: Math.max(0, Math.floor(num(el.itemQty.value))), min: el.itemMin.value.trim() === '' ? '' : Math.max(0, Math.floor(num(el.itemMin.value))) }, 'Item not added');
  if (ok) { form.reset(); const f = document.getElementById('itemName'); if (f) f.focus(); }
}

function arm(key) {
  if (S.armed === key) { S.armed = null; return true; }
  S.armed = key;
  render();

// ---------- photos ----------

// Photos live in the data repo as images/<item id>.jpg. A phone photo is
// shrunk and re-encoded before upload: about 150 KB instead of 3 MB, and
// re-encoding through a canvas drops the EXIF block with its GPS position.
const PHOTO_MAX = 1000;
const photoPath = id => 'images/' + id + '.jpg';

async function shrink(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const scale = Math.min(1, PHOTO_MAX / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * scale));
    c.height = Math.max(1, Math.round(img.naturalHeight * scale));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res, rej) => {
      const done = b => (b ? res(b) : rej(err('the photo could not be converted to JPEG')));
      c.toBlob(done, 'image/jpeg', 0.8);
    });
  } catch (e) {
    throw e.message ? e : err('that file is not a photo this phone can open');
  } finally { URL.revokeObjectURL(url); }
}

async function blobB64(blob) {
  const buf = new Uint8Array(await blob.arrayBuffer());
  let bin = '';
  for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  return btoa(bin);
}

// Each photo downloads once per phone: kept in the browser cache under its
// version (the file sha), so a replaced photo is fetched again.
const photoUrls = new Map();
const photoLoading = new Set();
const photoKey = sha => new URL('photo-cache/' + sha, location.href).href;
async function photoCache() {
  try { return 'caches' in window ? await caches.open('box-stock-photos') : null; } catch { return null; }
}
function keepPhoto(sha, blob) {
  photoUrls.set(sha, URL.createObjectURL(blob));
  photoCache().then(c => c && c.put(photoKey(sha), new Response(blob, { headers: { 'Content-Type': 'image/jpeg' } }))).catch(() => {});
}
async function loadPhoto(id, sha) {
  if (photoUrls.has(sha) || photoLoading.has(sha)) return;
  photoLoading.add(sha);
  try {
    const c = await photoCache();
    const hit = c ? await c.match(photoKey(sha)) : null;
    if (hit) photoUrls.set(sha, URL.createObjectURL(await hit.blob()));
    else keepPhoto(sha, await gh('GET', null, photoPath(id), true));
    paintPhotos();
  } catch { /* a missing photo leaves an empty square; the next render tries again */ }
  finally { photoLoading.delete(sha); }
}
function paintPhotos() {
  for (const img of app.querySelectorAll('img[data-sha]')) {
    const u = photoUrls.get(img.dataset.sha);
    if (u) { if (img.getAttribute('src') !== u) img.src = u; }
    else loadPhoto(img.dataset.id, img.dataset.sha);
  }
}

function thumb(id, it) {
  if (!it || !it.photo) return null;
  return h('button', { class: 'thumbbtn', type: 'button', 'aria-label': 'Photo of ' + it.name, onclick: () => openPhoto(it) },
    h('img', { alt: '', 'data-id': id, 'data-sha': it.photo }));
}

const lightbox = document.getElementById('lightbox');
function openPhoto(it) {
  const u = photoUrls.get(it.photo);
  if (!u) return;
  lightbox.querySelector('img').src = u;
  lightbox.querySelector('p').textContent = it.name + ' · tap to close';
  lightbox.hidden = false;
}
lightbox.addEventListener('click', () => { lightbox.hidden = true; });
addEventListener('keydown', e => { if (e.key === 'Escape') lightbox.hidden = true; });

let photoBusy = false;
async function uploadPhoto(id, fileIn) {
  const it = S.items.get(id);
  if (!it || !fileIn || photoBusy) return;
  photoBusy = true;
  say('Saving photo…', 0);
  try {
    const blob = await shrink(fileIn);
    const content = await blobB64(blob);
    const put = sha => gh('PUT', { message: 'photo of ' + it.name, content, ...(sha ? { sha } : {}) }, photoPath(id));
    let res;
    try { res = await put(it.photo || undefined); }
    catch (e) {
      if (!e.conflict) throw e;
      const cur = await gh('GET', null, photoPath(id)).catch(() => null);
      res = await put(cur ? cur.sha : undefined);
    }
    keepPhoto(res.content.sha, blob);
    if (await act({ op: 'setPhoto', id, photo: res.content.sha }, 'Photo not saved')) say('Photo saved.');
  } catch (e) {
    if (e.offline) say('Photo not saved: no connection. Try again once you have signal.', 9000);
    else fail(e, 'Photo not saved');
  } finally { photoBusy = false; }
}

async function removePhoto(id) {
  const it = S.items.get(id);
  if (!it || !it.photo || !arm('photo:' + id)) return;
  try { await gh('DELETE', { message: 'remove photo of ' + it.name, sha: it.photo }, photoPath(id)); }
  catch (e) { if (!e.notFound && !e.conflict) { fail(e, 'Photo not removed'); return; } }
  await act({ op: 'setPhoto', id, photo: null }, 'Photo not removed');
}

  if (!name) return;
  const newId = 'k' + rid();

async function takeKit(id) {
  if (!arm('take:' + id)) return;
  const r = await act({ op: 'takeKit', kit: id }, 'Kit not taken');
  if (!r) return;
  const { taken, short } = r.op.result;
  S.lastTake = { kit: id, taken, short };
  render();
  const n = Object.keys(short).length;
  say(n ? 'Kit taken, ' + plural(n, 'part', 'parts') + ' short.' : 'Kit taken.');
}

async function putBack(id) {
  if (!S.lastTake || S.lastTake.kit !== id) return;
  if (await act({ op: 'putBack', kit: id, taken: S.lastTake.taken }, 'Kit not put back')) {
    S.lastTake = null;
    render();
    say('Kit put back.');
  }
}

// ---------- stocktake ----------

function startCount(boxId) {
  if (queue.some(o => S.items.get(o.id)?.box === boxId)) {
    drain();
    say('Saving the last taps first. Tap Count box again in a moment.');
    return;
  }
  S.counting = true;
  S.editing = false;
  render();
}

async function saveCount(boxId) {
  const counts = {};
  for (const [id] of itemsIn(boxId)) {
    const el = document.getElementById('count-' + id);
    const n = Number(el && el.value);
    if (!el || el.value.trim() === '' || !Number.isInteger(n) || n < 0) { say('Count for ' + S.items.get(id).name + ' must be a whole number, 0 or more.'); if (el) el.focus(); return; }
    counts[id] = n;
  }
  if (await act({ op: 'stocktake', box: boxId, counts }, 'Count not saved')) {
    S.counting = false;
    render();
    say('Count saved.');
  }
}

async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied'; }
  catch {
    const el = btn.closest('.panel').querySelector('.taglink');
    if (el) getSelection().selectAllChildren(el);
    btn.textContent = 'Selected, copy it';
  }
  setTimeout(() => { btn.textContent = 'Copy link'; }, 2500);
}

      const n = Math.floor(num(el.kitQty.value));
      if (!el.kitItem.value || n < 1) { say('Pick a part and a quantity of 1 or more.'); return; }
      act({ op: 'setKitLine', kit: id, item: el.kitItem.value, qty: n }, 'Part not added');
    } },
      h('h2', { text: 'Add a part' }),
      choices.length ? h('div', { class: 'form' },
        h('label', { class: 'full' }, 'Part', h('select', { id: 'kitItem', name: 'kitItem' }, choices)),
        h('label', null, 'How many', h('input', { id: 'kitQty', name: 'kitQty', type: 'number', inputmode: 'numeric', min: '1', step: '1', value: '1' })),
        h('button', { class: 'btn primary', type: 'submit', text: 'Add part' }))
        : h('p', { text: 'Every listed item is already in this kit. Add items to a box first.' })));
    out.push(h('div', { class: 'panel' }, h('h2', { text: 'Kit' }),
      h('div', { class: 'row' }, h('button', { class: 'btn danger' + (S.armed === 'kit:' + id ? ' armed' : ''), type: 'button',
        text: S.armed === 'kit:' + id ? 'Tap again to delete kit' : 'Delete kit',
        onclick: async () => { if (!arm('kit:' + id)) return; if (await act({ op: 'deleteKit', id }, 'Kit not deleted')) location.hash = ''; } }))));
  } else if (lines.length) {
    const armed = S.armed === 'take:' + id;
    out.push(h('button', { class: 'btn primary block' + (armed ? ' armed' : ''), type: 'button',
      text: armed ? 'Tap again to take ' + kit.name : 'Take kit', onclick: () => takeKit(id) }));
    out.push(h('p', { class: 'foot', text: 'Takes every part above out of its box. A short part takes what is there.' }));
  }
  return out;
}

function paintQty(id) {
  const out = app.querySelector('[data-qty="' + CSS.escape(id) + '"]');
  if (!out) return;
  const q = shownQty(id);
  out.textContent = q;
  out.classList.toggle('dirty', !!queued(id));
  const li = out.closest('.item');
  const it = S.items.get(id);
  if (li && it) li.classList.toggle('low', isLow(id, it));
  const minus = li && li.querySelector('.minus');
  if (minus) minus.disabled = q <= 0;
}

function paintSync() {
  const n = queue.length;
  syncEl.hidden = !(n && S.offline);
  syncEl.textContent = n ? plural(n, 'change', 'changes') + ' waiting for signal. They send by themselves; keep this page open or come back to it.' : '';
}

// Snapshots rebuild the view; keep whatever someone is half way through typing.
function render() {
  const keep = {};
  for (const el of app.querySelectorAll('input[id]')) keep[el.id] = el.value;
  const focus = document.activeElement && app.contains(document.activeElement) ? document.activeElement.id : null;

  let kids;
  if (!REPO) kids = notice('Box Stock', 'Not connected yet', 'config.js names no stock repo. Set STOCK_REPO to the private repo that holds stock.json.');
  else if (!KEY) kids = [...notice('Box Stock', 'Tap a box tag', 'Hold your phone to the NFC tag on a Renegade box to open its stock.'), codeForm()];
  else if (S.badKey) kids = [...notice('Box Stock', 'This tag code no longer works', 'It may have expired or been replaced. Tap a box tag with the new link, or ask Ethan for one.'), codeForm()];
  else if (!S.loaded) kids = [header(S.view ? 'Box' : 'Box Stock', S.offline ? 'Can’t reach the stock list yet. It keeps trying.' : 'Loading…')];
  else kids = S.kitView ? kitView(S.kitView) : S.view ? boxView(S.view) : listView();
  app.replaceChildren(...kids);

  // Name and low-level fields show the saved value unless that field has focus.
  for (const el of app.querySelectorAll('input[id]')) {
    if (!(el.id in keep)) continue;
    const savedField = el.id.startsWith('name-') || el.id.startsWith('min-');
    if (!savedField || el.id === focus) el.value = keep[el.id];
  }
  if (focus) { const f = document.getElementById(focus); if (f) f.focus(); }
  paintSync();
  paintPhotos();
  shape = shapeKey();
}

// A count change alone repaints the numbers in place. Rebuilding the buttons
// while someone is tapping would drop a tap.
let shape = '';
function shapeKey() {
  return JSON.stringify([S.view, S.kitView, S.editing, S.counting, S.armed, S.badKey, S.loaded, S.offline && !S.loaded, S.lastTake,
    [...S.boxes].map(([id, b]) => [id, b.name, b.order, b.checked]),
    [...S.items].map(([id, it]) => [id, it.box, it.name, it.unit, it.min, it.photo]),
    [...S.kits].map(([id, k]) => [id, k.name, k.lines])]);
}
function refresh() {
  if (S.view && !S.editing && !S.counting && shapeKey() === shape) {
    for (const id of S.items.keys()) paintQty(id);
    const meta = app.querySelector('.headrow .meta');
    if (meta && S.boxes.has(S.view)) meta.textContent = boxMeta(S.view);
    paintSync();
    return;
  }
  render();
}

// A tag link is #box=<id>&k=<key>. The key stays in the address on every view:
// an iPhone home screen app keeps its own storage apart from Safari's, so the
// address it is added from is the only way the key reaches it.
function route() {
  const p = new URLSearchParams(location.hash.slice(1));
  const k = p.get('k');
  if (k && k !== KEY) {
    KEY = k;
    S.badKey = false;
    try { localStorage.setItem(KKEY, k); } catch {}
    if (!S.loaded) setTimeout(poll);
  }
  if (!k && KEY) {
    p.set('k', KEY);
    history.replaceState(null, '', location.pathname + location.search + '#' + p);
  }
  S.view = p.get('box');
  S.kitView = p.get('kit');
  S.editing = false;
  S.counting = false;
  S.armed = null;
  lightbox.hidden = true;
  render();
  scrollTo(0, 0);
}
addEventListener('hashchange', route);

route();
drain();
poll();
</script>
</body>
</html>
